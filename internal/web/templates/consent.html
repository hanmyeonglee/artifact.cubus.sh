<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Authorize Application · artifact.cubus.sh</title>
  <link rel="stylesheet" href="/static/viewer.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="/">artifact.cubus.sh</a>
    </div>
    <div class="topbar-right">
      <span class="muted">Signed in as {{.User.Username}}</span>
    </div>
  </header>

  <main class="container">
    <div class="card card-narrow">
      <h2>Authorize MCP Client</h2>
      <p><strong>{{.ClientName}}</strong> wants to access your <code>artifact.cubus.sh</code> account.</p>
      <p class="muted">Redirect URI: <code>{{.RedirectURI}}</code></p>
      {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}

      <form method="post" action="/oauth/authorize">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <input type="hidden" name="client_id" value="{{.ClientID}}">
        <input type="hidden" name="redirect_uri" value="{{.RedirectURI}}">
        <input type="hidden" name="response_type" value="code">
        <input type="hidden" name="code_challenge" value="{{.CodeChallenge}}">
        <input type="hidden" name="code_challenge_method" value="S256">
        <input type="hidden" name="state" value="{{.State}}">
        <input type="hidden" name="scope" value="{{.RequestedScope}}">
        <input type="hidden" name="resource" value="{{.Resource}}">

        <div class="form-group">
          <label>Requested permissions</label>
          {{range .ScopeOptions}}
            <label class="scope-item">
              {{if .Required}}
                <input type="checkbox" name="granted_scope" value="{{.Name}}" checked disabled>
                <input type="hidden" name="granted_scope" value="{{.Name}}">
              {{else}}
                <input type="checkbox" name="granted_scope" value="{{.Name}}" checked>
              {{end}}
              <span><code>{{.Name}}</code> — {{.Description}}</span>
            </label>
          {{end}}
        </div>

        <div class="topbar-right">
          <button class="btn btn-primary" type="submit" name="decision" value="approve">Approve</button>
          <button class="btn btn-danger" type="submit" name="decision" value="deny">Deny</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
